# Project Bootstrap Template v2.0
# Project: repomapper-go

goal: |
  Aider由来のRepoMapをGoで再実装する。
  Gitリポジトリから重要なシンボルを抽出し、LLMに渡しやすい簡潔なマップを生成する。
  CLIとMCPサーバーの両方で利用できる。

requirements:
  must:
    - Gitリポジトリを指定してシンボルマップを出力できる
    - Go と Rust のシンボル抽出ができる
    - ファイル単位でまとめた読みやすいテキスト出力
    - MCPサーバー（stdio）で repo_map ツールを提供できる
    - テスト関数をオプションで除外できる（-include-tests / include_tests）
  should:
    - 重要度ランキング
    - トークン数制限（-tokens / MCP引数）
    - 解析エラーを黙殺せず警告として出す
  constraints:
    language_framework: Go 1.22+
    external_services: なし（オフライン動作）
    performance_scale: 中規模リポジトリを数秒〜十数秒
    other_hard_limits: |
      - CGOに依存しないこと
      - Rust解析は外部バイナリ（syn）を利用してよい

repo_structure: |
  root/
  ├── go.mod / go.sum
  ├── README.md
  ├── design.yaml
  ├── cmd/
  │   ├── repomapper/          # CLI
  │   └── mcp/                 # MCPサーバー（stdio）
  ├── internal/
  │   ├── analyzer/
  │   │   ├── symbol.go        # Symbol 定義
  │   │   ├── treesitter.go    # tree-sitter アナライザー
  │   │   ├── rust_analyzer.go # Rust アナライザー（外部バイナリ）
  │   │   └── ranker.go        # 重要度ランキング
  │   ├── output/
  │   │   ├── formatter.go     # 整形
  │   │   └── limiter.go       # トークン制限
  │   └── mapper/              # CLI/MCP共通
  └── rust-analyzer/           # Rust解析バイナリ（syn）

approach:
  - Walking Skeletonから始める
  - 言語ごとにアナライザーを独立させる
  - CLIとMCPで mapper を共有する
  - エラーは握りつぶさず警告する

main_modules:
  - name: analyzer
    responsibility: 言語ごとのシンボル抽出とランキング
    depends_on: []
  - name: output
    responsibility: 整形・トークン制限
    depends_on: [analyzer]
  - name: mapper
    responsibility: 解析〜出力の一連処理
    depends_on: [analyzer, output]
  - name: mcp
    responsibility: MCPツール repo_map の提供
    depends_on: [mapper]

contract:
  inputs:
    - Gitリポジトリのパス
    - （任意）最大トークン数
    - （任意）テスト関数を含めるか
  outputs:
    - ファイル単位のシンボルマップ（テキスト）
  invariants:
    - Gitリポジトリでない場合はエラー終了
    - 未対応言語のファイルは無視する
    - 個別ファイルの解析失敗は処理全体を止めない
    - デフォルトではテスト関数を除外する
  error_handling:
    - 解析エラーは警告としてstderrに出し、処理は継続する
    - リポジトリ自体が無効な場合のみfatal
    - Rust analyzer バイナリ不在時はビルド方法を案内する

testing:
  strategy:
    unit: output / ranker / mapper
    integration: 実際のリポジトリに対するマップ生成
  must_pass_cases:
    - Goリポジトリから関数・型が取れる
    - Rustリポジトリから関数・型・traitが取れる
    - 空に近いリポジトリでpanicしない
    - -tokens 指定時に出力が制限される
    - -include-tests=false でテスト関数が除外される
    - -include-tests=true でテスト関数が含まれる
  how_to_run: |
    go test ./...
    cargo test --manifest-path rust-analyzer/Cargo.toml
