# Project Bootstrap Template v2.0
# Project: repomapper-go

goal: |
  Aider由来のRepoMapをGoで再実装する。
  Gitリポジトリから重要なシンボルを抽出し、LLMに渡しやすい簡潔なマップを生成するCLIを作る。
  高速・シングルバイナリ・依存最小を目指す。

requirements:
  must:
    - Gitリポジトリを指定してシンボルマップを出力できる
    - Go と Rust のシンボル抽出ができる
    - ファイル単位でまとめた読みやすいテキスト出力
  should:
    - 重要度ランキング
    - トークン数制限（-tokens）
    - MCPサーバーとしてツール提供できる
  constraints:
    language_framework: Go 1.22+
    external_services: なし（オフライン動作）
    performance_scale: 中規模リポジトリを数秒〜十数秒
    other_hard_limits: |
      - CGOに依存しないこと
      - Rust解析は外部バイナリ（syn）を利用してよい

repo_structure: |
  root/
  ├── go.mod / go.sum
  ├── README.md
  ├── design.yaml
  ├── cmd/
  │   ├── repomapper/
  │   │   └── main.go          # CLI
  │   └── mcp/
  │       └── main.go          # MCPサーバー（stdio）
  ├── internal/
  │   ├── analyzer/
  │   ├── output/
  │   └── mapper/              # CLI/MCP共通のマップ生成
  ├── rust-analyzer/
  └── scripts/

approach:
  - Walking Skeleton（Git認識 + ファイル一覧）から始める
  - 言語ごとにアナライザーを独立させる
  - 出力フォーマットを先に固める
  - ランキング・トークン制限は後回し

main_modules:
  - name: analyzer
    responsibility: 言語ごとのシンボル抽出
    depends_on: []
  - name: output
    responsibility: 整形・トークン制限
    depends_on: [analyzer]
  - name: mapper
    responsibility: 解析〜出力までの一連処理（CLI/MCP共通）
    depends_on: [analyzer, output]
  - name: mcp
    responsibility: MCPツール repo_map の提供
    depends_on: [mapper]
    
contract:
  inputs:
    - Gitリポジトリのパス
  outputs:
    - ファイル単位でまとめたシンボルマップ（テキスト）
  invariants:
    - Gitリポジトリでない場合はエラー終了
    - 未対応言語のファイルは無視する
  error_handling:
    - 解析エラーは警告として出力し、処理は継続する

implementation_loop:
  - 最小機能を実装
  - 動作確認
  - 次の言語 or 機能を追加

testing:
  strategy:
    unit: 各analyzerの抽出結果
    integration: 実際のリポジトリに対するマップ生成
  must_pass_cases:
    - Goリポジトリから関数・型が取れる
    - Rustリポジトリから関数・型・traitが取れる
    - 空に近いリポジトリでpanicしない
  how_to_run: |
    go test ./...
    cargo test --manifest-path rust-analyzer/Cargo.toml